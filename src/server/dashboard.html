<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E2E Change-Impact Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #c9d1d9; --text2: #8b949e;
    --green: #3fb950; --red: #f85149; --blue: #58a6ff;
    --orange: #d2991d; --purple: #a371f7; --accent: #1f6feb;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',monospace; background:var(--bg); color:var(--text); min-height:100vh; }
  .header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; gap:12px; }
  .header h1 { font-size:16px; color:var(--accent); }
  .header .actions { margin-left:auto; display:flex; gap:8px; }
  .header button { background:var(--bg3); border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
  .header button:hover { background:var(--accent); }
  .pipeline { display:flex; gap:4px; padding:12px 20px; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; }
  .step { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; font-size:12px; white-space:nowrap; }
  .step .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .step.done .dot { background:var(--green); }
  .step.current .dot { background:var(--accent); animation:pulse 1s infinite; }
  .step.pending .dot { background:var(--border); }
  .step .arrow { color:var(--text2); }
  .tabs { display:flex; gap:0; padding:0 12px; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab { padding:8px 16px; font-size:13px; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .content { padding:20px; max-width:1400px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .card .label { font-size:11px; color:var(--text2); text-transform:uppercase; }
  .card .value { font-size:24px; font-weight:700; margin-top:4px; }
  .card .value.green { color:var(--green); }
  .card .value.red { color:var(--red); }
  .card .value.blue { color:var(--blue); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:8px 12px; background:var(--bg3); color:var(--text2); font-weight:600; border-bottom:1px solid var(--border); }
  td { padding:6px 12px; border-bottom:1px solid var(--border); }
  tr:hover td { background:var(--bg2); }
  .tag { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; }
  .tag.A { background:#1a3a1a; color:var(--green); }
  .tag.M { background:#1a2a3a; color:var(--blue); }
  .tag.D { background:#3a1a1a; color:var(--red); }
  .tag.R { background:#2a1a3a; color:var(--purple); }
  .tag.P0 { background:#3a1a1a; color:var(--red); }
  .tag.P1 { background:#3a3a1a; color:var(--orange); }
  .tag.P2 { background:#1a2a1a; color:var(--green); }
  .chain { background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:10px; }
  .chain .source { color:var(--accent); font-weight:600; margin-bottom:8px; }
  .hop { display:flex; align-items:center; gap:6px; padding:4px 0; font-size:12px; }
  .hop .rel { padding:1px 5px; border-radius:3px; font-size:10px; }
  .hop .rel.calls { background:#1a3a1a; color:var(--green); }
  .hop .rel.imports { background:#1a2a3a; color:var(--blue); }
  .hop .rel.references { background:#2a2a1a; color:var(--orange); }
  .hop .rel.instantiates { background:#2a1a3a; color:var(--purple); }
  .hop .rel.api-consumer { background:#3a1a1a; color:var(--red); }
  .hop .arrow-hop { color:var(--text2); }
  .hop .conf-high { color:var(--green); }
  .hop .conf-low { color:var(--orange); }
  .hop .terminal { color:var(--green); font-weight:600; }
  pre { background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:12px; overflow:auto; font-size:12px; line-height:1.5; max-height:600px; }
  code { font-family:'Monaco','Menlo',monospace; }
  .empty { text-align:center; padding:40px; color:var(--text2); }
  .scenario { background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:8px; }
  .scenario .sname { font-weight:600; margin-bottom:4px; }
  .scenario .ssteps { color:var(--text2); font-size:12px; }
  .video { max-width:100%; border-radius:6px; border:1px solid var(--border); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .img-preview { max-width:400px; max-height:300px; border-radius:6px; border:1px solid var(--border); cursor:pointer; }
  input[type="text"], input[type="checkbox"] { accent-color:var(--accent); }
  .page-row { display:flex; gap:20px; margin-bottom:16px; padding:12px; background:var(--bg2); border-radius:8px; border:1px solid var(--border); }
  .page-info { flex:1; }
  .page-info h3 { font-size:14px; margin-bottom:4px; }
  .page-info .url { font-size:12px; color:var(--accent); }
  .page-info .elems { margin-top:8px; }
  .page-info .elems span { display:inline-block; background:var(--bg3); padding:2px 8px; border-radius:4px; font-size:11px; margin:2px; }
</style>
</head>
<body>
<div class="header">
  <h1>&#9670; E2E Change-Impact Dashboard</h1>
  <div class="actions">
    <button onclick="refresh()">&#x21bb; 刷新</button>
    <span style="font-size:11px;color:var(--text2);align-self:center" id="info"></span>
  </div>
</div>

<div class="pipeline" id="pipeline"></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>
const TABS = [
  { id:'tasks',    label:'任务' },
  { id:'overview', label:'概览' },
  { id:'diff',     label:'Diff' },
  { id:'trace',    label:'Trace' },
  { id:'analysis', label:'分析' },
  { id:'pages',    label:'页面' },
  { id:'tests',    label:'测试' },
  { id:'results',  label:'结果' },
  { id:'reports',  label:'报告' },
];
let activeTab = 'tasks';
let data = {};

async function api(p) {
  const r = await fetch('/api/' + p);
  return r.ok ? r.json() : null;
}
async function apiText(p) {
  const r = await fetch('/api/' + p);
  return r.ok ? r.text() : null;
}
async function apiPost(p, body) {
  const r = await fetch('/api/' + p, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  return r.ok ? r.json() : null;
}
async function apiPut(p, body) {
  const r = await fetch('/api/' + p, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  return r.ok ? r.json() : null;
}
async function apiDelete(p) {
  await fetch('/api/' + p, { method:'DELETE' });
}

async function refresh() {
  const status = await api('status');
  data.status = status;
  data.diff = await api('diff');
  data.trace = await api('trace');
  data.analysis = await api('analysis');
  data.pages = await api('pages');
  data.tests = await api('tests');
  data.results = await api('results');
  data.reports = await api('reports');
  renderPipeline(status);
  renderContent();
}

function renderPipeline(status) {
  if (!status) return;
  const steps = status.steps;
  let firstPendingFound = false;
  document.getElementById('pipeline').innerHTML = steps.map((s,i) => {
    let cls = 'pending';
    if (s.done) cls = 'done';
    else if (!firstPendingFound) { cls = 'current'; firstPendingFound = true; }
    const arrow = i < steps.length-1 ? '<span class="arrow">→</span>' : '';
    return `<div class="step ${cls}"><span class="dot"></span>${s.label}${arrow}</div>`;
  }).join('');
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<div class="tab ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</div>`
  ).join('');
}

function switchTab(id) { activeTab = id; renderTabs(); renderContent(); }

function renderContent() {
  const c = document.getElementById('content');
  switch (activeTab) {
    case 'overview': c.innerHTML = renderOverview(); break;
    case 'diff':     c.innerHTML = renderDiff(); break;
    case 'trace':    c.innerHTML = renderTrace(); break;
    case 'analysis': c.innerHTML = renderAnalysis(); break;
    case 'pages':    c.innerHTML = renderPages(); break;
    case 'tests':    c.innerHTML = renderTests(); break;
    case 'results':  c.innerHTML = renderResults(); break;
    case 'reports':  c.innerHTML = renderReportsTab(); break;
    case 'tasks':    renderTasksTab(c); break;
  }
}

function renderOverview() {
  const d = data.diff;
  const t = data.trace;
  const a = data.analysis;
  const r = data.results;
  const files = d?.projects?.[0]?.files || d?.files || [];
  const stats = d?.projects?.[0]?.stats || d?.stats || {};

  let testsPassed = 0, testsFailed = 0;
  if (Array.isArray(r)) { testsPassed = r.filter(x=>x.status==='passed').length; testsFailed = r.filter(x=>x.status==='failed').length; }

  return `
    <div class="cards">
      <div class="card"><div class="label">变更文件</div><div class="value blue">${stats.filesChanged||0}</div></div>
      <div class="card"><div class="label">新增行</div><div class="value green">+${stats.additions||0}</div></div>
      <div class="card"><div class="label">删除行</div><div class="value red">-${stats.deletions||0}</div></div>
      <div class="card"><div class="label">Trace 链</div><div class="value blue">${t?.chains?.length||0}</div></div>
      <div class="card"><div class="label">受影响页面</div><div class="value">${a?.affectedPages?.length||0}</div></div>
      <div class="card"><div class="label">测试通过</div><div class="value green">${testsPassed}</div></div>
      <div class="card"><div class="label">测试失败</div><div class="value red">${testsFailed}</div></div>
    </div>
    <h3 style="margin-bottom:10px">Pipeline 状态</h3>
    <table>
      ${(data.status?.steps||[]).map(s => `
        <tr>
          <td>${s.done ? '&#x2705;' : '&#x23F3;'}</td>
          <td>${s.label}</td>
          <td style="color:${s.done?'var(--green)':'var(--text2)'}">${s.done ? '完成' : '等待中'}</td>
        </tr>
      `).join('')}
    </table>`;
}

function renderDiff() {
  const d = data.diff;
  if (!d) return '<div class="empty">暂无 Diff 数据</div>';
  const files = d?.projects?.[0]?.files || d?.files || [];
  const commits = d?.projects?.[0]?.commits || d?.commits || [];
  const stats = d?.projects?.[0]?.stats || d?.stats || {};

  let html = `<div class="cards">
    <div class="card"><div class="label">文件数</div><div class="value blue">${stats.filesChanged||0}</div></div>
    <div class="card"><div class="label">+Add</div><div class="value green">${stats.additions||0}</div></div>
    <div class="card"><div class="label">-Del</div><div class="value red">${stats.deletions||0}</div></div>
  </div>`;

  html += '<h3 style="margin-bottom:10px">变更文件</h3><table><tr><th>状态</th><th>文件</th><th>+/-</th></tr>';
  for (const f of (files||[]).slice(0, 200)) {
    html += `<tr><td><span class="tag ${f.status}">${f.status}</span></td><td style="font-size:12px">${esc(f.path||f)}</td><td style="font-size:11px;color:var(--text2)">+${f.additions||0}/-${f.deletions||0}</td></tr>`;
  }
  html += '</table>';

  if (commits?.length) {
    html += `<h3 style="margin:16px 0 10px">Commits (${commits.length})</h3><table><tr><th>Hash</th><th>Message</th><th>Author</th></tr>`;
    for (const c of commits.slice(0, 50)) {
      html += `<tr><td style="font-size:11px;color:var(--accent)">${c.hash||''}</td><td>${esc(c.message||'')}</td><td style="color:var(--text2)">${esc(c.author||'')}</td></tr>`;
    }
    html += '</table>';
  }
  return html;
}

function renderTrace() {
  const t = data.trace;
  if (!t || !t.chains?.length) return '<div class="empty">暂无 Trace 数据</div>';

  let html = `<div class="cards">
    <div class="card"><div class="label">总链数</div><div class="value blue">${t.chains.length}</div></div>
    <div class="card"><div class="label">受影响页面</div><div class="value">${t.affectedPages?.length||0}</div></div>
  </div>`;

  for (const chain of t.chains || []) {
    const lowCount = (chain.hops||[]).filter(h=>h.confidence==='low').length;
    html += `<div class="chain">
      <div class="source">${esc(chain.sourceFile)} (${chain.symbols?.length||0} symbols${lowCount>0?`, ${lowCount} low-confidence`:''})</div>`;
    for (const hop of chain.hops||[]) {
      const termClass = hop.terminal ? ' terminal' : '';
      html += `<div class="hop${termClass}">
        <span class="rel ${hop.relation}">${hop.relation}</span>
        <span class="arrow-hop">→</span>
        <span>${esc(hop.file)}</span>
        <span class="conf-${hop.confidence}">[${hop.confidence}]</span>
        ${hop.terminal ? `<span class="terminal">&#x2714; ${hop.terminalReason||'terminal'}</span>` : ''}
      </div>`;
    }
    if (chain.affectedPages?.length) {
      html += `<div style="margin-top:6px;font-size:12px;color:var(--green)">页面: ${chain.affectedPages.map(p=>esc(p)).join(', ')}</div>`;
    }
    html += '</div>';
  }
  return html;
}

function renderAnalysis() {
  const a = data.analysis;
  if (!a || !a.affectedPages) return '<div class="empty">暂无分析数据</div>';

  let html = `<div class="cards">
    <div class="card"><div class="label">风险等级</div><div class="value" style="color:${a.riskLevel==='high'?'var(--red)':a.riskLevel==='medium'?'var(--orange)':'var(--green)'}">${a.riskLevel||'-'}</div></div>
    <div class="card"><div class="label">受影响页面</div><div class="value blue">${a.affectedPages.length}</div></div>
  </div>`;
  html += `<div style="background:var(--bg2);padding:12px;border-radius:6px;margin-bottom:12px;border:1px solid var(--border)">
    <strong>摘要:</strong> ${esc(a.summary||'')}</div>`;

  for (const page of a.affectedPages||[]) {
    html += `<div class="chain">
      <div class="source">${esc(page.name)} &nbsp; <code style="color:var(--accent)">${esc(page.route)}</code></div>
      <div style="font-size:12px;color:var(--text2);margin:6px 0">${esc(page.changeDescription||'')} | ${page.changeType}</div>`;
    for (const s of page.testScenarios||[]) {
      html += `<div class="scenario"><div class="sname"><span class="tag ${s.priority}">${s.priority}</span> ${esc(s.name)}</div>
        <div class="ssteps">步骤: ${(s.steps||[]).join(' → ')}</div>
        <div class="ssteps" style="color:var(--green)">预期: ${esc(s.expectedResult||'')}</div></div>`;
    }
    html += '</div>';
  }
  if (a.recommendation) {
    html += `<div style="background:var(--bg2);padding:12px;border-radius:6px;margin-top:12px;border:1px solid var(--border);color:var(--orange)">
      <strong>建议:</strong> ${esc(a.recommendation)}</div>`;
  }
  return html;
}

function renderPages() {
  const pages = data.pages;
  if (!pages?.length) return '<div class="empty">暂无页面快照数据</div>';

  return pages.map(p => `
    <div class="page-row">
      <div class="page-info">
        <h3>${esc(p.title||p.route)}</h3>
        <div class="url">${esc(p.url||p.route)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:4px">${p.interactiveElements?.length||0} 个交互元素</div>
      </div>
      ${p.screenshot ? `<img class="img-preview" src="/api/pages/image?path=${encodeURIComponent(p.screenshot)}" onclick="window.open('/api/pages/image?path=${encodeURIComponent(p.screenshot)}')" onerror="this.style.display='none'" />` : ''}
    </div>
  `).join('');
}

async function renderTests() {
  const tests = data.tests;
  if (!tests?.length) return '<div class="empty">暂无生成的测试文件</div>';

  let html = `<div style="margin-bottom:12px;color:var(--text2)">${tests.length} 个 spec 文件</div>`;
  for (const f of tests) {
    const content = await apiText('tests?file=' + encodeURIComponent(f));
    html += `<details style="margin-bottom:8px"><summary style="cursor:pointer;color:var(--accent);padding:4px 0">${esc(f)}</summary>
      <pre><code>${esc(content||'// empty')}</code></pre></details>`;
  }
  return html;
}

function renderResults() {
  const r = data.results;
  if (!r?.length) return '<div class="empty">暂无测试结果</div>';

  const passed = r.filter(x=>x.status==='passed').length;
  const failed = r.filter(x=>x.status==='failed').length;
  return `
    <div class="cards">
      <div class="card"><div class="label">总计</div><div class="value blue">${r.length}</div></div>
      <div class="card"><div class="label">通过</div><div class="value green">${passed}</div></div>
      <div class="card"><div class="label">失败</div><div class="value red">${failed}</div></div>
    </div>
    <table><tr><th>状态</th><th>文件</th><th>场景</th><th>耗时</th></tr>
    ${r.map(x => `
      <tr>
        <td>${x.status==='passed'?'&#x2705;':'&#x274C;'}</td>
        <td style="font-size:12px">${esc(x.testFile)}</td>
        <td style="font-size:12px">${(x.scenarios||[]).map(s=>`${s.status==='passed'?'&#x2705;':'&#x274C;'} ${esc(s.name)}`).join('<br>')}</td>
        <td style="color:var(--text2)">${x.duration}ms</td>
      </tr>
    `).join('')}
    </table>`;
}

async function renderReportsTab() {
  const reports = data.reports;
  if (!reports?.length) return '<div class="empty">暂无报告</div>';

  let html = '';
  for (const f of reports) {
    const content = await apiText('reports?file=' + encodeURIComponent(f));
    html += `<details style="margin-bottom:8px"><summary style="cursor:pointer;color:var(--accent);padding:4px 0">${esc(f)}</summary>
      <pre><code>${esc(content||'')}</code></pre></details>`;
  }
  return html;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- Tasks ----
let taskDetailId = null;

async function renderTasksTab(container) {
  const tasks = await api('tasks') || [];
  container.innerHTML = `
    <div class="cards">
      <div class="card"><div class="label">任务数</div><div class="value blue">${tasks.length}</div></div>
    </div>
    <details style="margin-bottom:16px">
      <summary style="cursor:pointer;color:var(--accent);padding:8px 0">+ 新建任务</summary>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:8px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label style="font-size:12px;color:var(--text2)">任务名称</label><input id="tfName" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:4px" placeholder="如: v1.0→v1.1 回归"></div>
          <div><label style="font-size:12px;color:var(--text2)">Base URL</label><input id="tfBaseUrl" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:4px" placeholder="http://localhost:3000"></div>
          <div><label style="font-size:12px;color:var(--text2)">项目路径</label><input id="tfProject" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:4px" placeholder="/path/to/project"></div>
          <div><label style="font-size:12px;color:var(--text2)">页面路由 (可选)</label><input id="tfPages" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:4px" placeholder="/login,/dashboard"></div>
          <div><label style="font-size:12px;color:var(--text2)">基线版本</label><input id="tfBase" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:4px" placeholder="v1.0.0"></div>
          <div><label style="font-size:12px;color:var(--text2)">目标版本</label><input id="tfTarget" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:4px" placeholder="v1.1.0"></div>
        </div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:12px">
          <label style="font-size:12px;color:var(--text2)"><input type="checkbox" id="tfHeaded"> 有头模式</label>
          <button onclick="addTask()" style="background:var(--accent);border:none;color:#fff;padding:6px 20px;border-radius:6px;cursor:pointer">保存</button>
        </div>
      </div>
    </details>
    <div id="taskList">${tasks.length ? tasks.map(t => taskCard(t)).join('') : '<div class="empty">暂无任务，点击上方「+ 新建任务」创建</div>'}</div>
    <div id="taskDetail"></div>`;
}

function taskCard(t) {
  const dt = t.createdAt ? new Date(t.createdAt).toLocaleString('zh-CN') : '';
  return `<div class="chain" style="position:relative;cursor:pointer" onclick="showTaskDetail('${t.id}')">
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div style="flex:1">
        <div class="source">${esc(t.name)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">${esc(t.project)}</div>
        <div style="font-size:11px;color:var(--accent);margin-top:2px">${esc(t.base)} → ${esc(t.target)} | ${esc(t.baseUrl)}</div>
      </div>
      <div style="display:flex;gap:6px" onclick="event.stopPropagation()">
        <button onclick="runTask('${t.id}')" style="background:var(--green);border:none;color:#fff;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px">运行</button>
        <button onclick="deleteTask('${t.id}')" style="background:var(--red);border:none;color:#fff;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px">删除</button>
      </div>
    </div>
  </div>`;
}

async function showTaskDetail(id) {
  taskDetailId = id;
  const tasks = await api('tasks') || [];
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const status = await api('status?output=test-output/' + id) || { steps: [] };
  const steps = status.steps || [];
  const doneCount = steps.filter(s => s.done).length;
  const detail = document.getElementById('taskDetail');
  detail.innerHTML = `
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center" onclick="closeTaskDetail()">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow:auto" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:18px">${esc(t.name)}</h2>
          <button onclick="closeTaskDetail()" style="background:none;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:4px;cursor:pointer">✕</button>
        </div>
        <div class="cards" style="margin-bottom:16px">
          <div class="card"><div class="label">Pipeline 进度</div><div class="value blue">${doneCount}/${steps.length}</div></div>
          <div class="card"><div class="label">基线</div><div style="font-size:13px;margin-top:4px">${esc(t.base)}</div></div>
          <div class="card"><div class="label">目标</div><div style="font-size:13px;margin-top:4px">${esc(t.target)}</div></div>
        </div>
        <div style="margin-bottom:12px">
          <div style="font-size:12px;color:var(--text2)">项目: ${esc(t.project)}</div>
          <div style="font-size:12px;color:var(--text2)">地址: ${esc(t.baseUrl)}</div>
          ${t.pages ? `<div style="font-size:12px;color:var(--text2)">页面: ${esc(t.pages)}</div>` : ''}
        </div>
        <h3 style="font-size:14px;margin-bottom:8px">Pipeline 步骤</h3>
        <table>
          ${steps.map(s => `<tr>
            <td>${s.done ? '&#x2705;' : '&#x23F3;'}</td>
            <td>${s.label}</td>
            <td style="color:${s.done?'var(--green)':'var(--text2)'}">${s.done ? '完成' : '等待中'}</td>
          </tr>`).join('')}
        </table>
        ${doneCount > 0 ? `<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;color:var(--text2)">输出目录:</span>
          <code style="font-size:11px;color:var(--accent)">test-output/${id}/</code>
        </div>` : ''}
        <div style="margin-top:16px;display:flex;gap:8px">
          <button onclick="runTask('${t.id}');closeTaskDetail()" style="background:var(--green);border:none;color:#fff;padding:6px 16px;border-radius:6px;cursor:pointer">运行 Pipeline</button>
          <button onclick="closeTaskDetail()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 16px;border-radius:6px;cursor:pointer">关闭</button>
        </div>
      </div>
    </div>
  `;
}

function closeTaskDetail() {
  taskDetailId = null;
  const detail = document.getElementById('taskDetail');
  if (detail) detail.innerHTML = '';
}

async function addTask() {
  const task = {
    name: document.getElementById('tfName').value || 'Untitled',
    project: document.getElementById('tfProject').value,
    base: document.getElementById('tfBase').value,
    target: document.getElementById('tfTarget').value,
    baseUrl: document.getElementById('tfBaseUrl').value,
    headed: document.getElementById('tfHeaded').checked,
    pages: document.getElementById('tfPages').value || undefined,
  };
  if (!task.project || !task.base || !task.target || !task.baseUrl) {
    alert('项目路径、基线版本、目标版本、Base URL 为必填项');
    return;
  }
  await apiPost('tasks', task);
  refresh();
}

async function runTask(id) {
  const r = await apiPost('tasks/' + id + '/run', {});
  if (r?.ok) alert('任务已启动 (PID: ' + r.pid + ')，输出目录: test-output/' + id);
}

async function deleteTask(id) {
  if (!confirm('确认删除?')) return;
  await apiDelete('tasks/' + id);
  refresh();
}

// Init
renderTabs();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
